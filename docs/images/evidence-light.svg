<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" role="img" aria-label="How a suggestion is scored: evidence for and against adds up to a likelihood, which sets its band; a curator makes the decision" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>How a suggestion is scored: evidence for and against adds up to a likelihood, which sets its band; a curator makes the decision</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a6074"/></marker></defs>
<rect width="1040" height="330" fill="#ffffff"/>
<text x="30" y="46" font-size="15" font-weight="650" fill="#1b2033">Evidence for one candidate paper</text>
<rect x="30" y="70" width="270" height="28" rx="8" fill="#f5f6fa" stroke="#d8dbe6"/><text x="44" y="89" font-size="13" fill="#1b2033">ORCID iD matches</text><text x="284" y="89" font-size="15" font-weight="700" fill="#0b7f7a" text-anchor="end">+</text><rect x="30" y="106" width="270" height="28" rx="8" fill="#f5f6fa" stroke="#d8dbe6"/><text x="44" y="125" font-size="13" fill="#1b2033">Organization in the affiliation</text><text x="284" y="125" font-size="15" font-weight="700" fill="#0b7f7a" text-anchor="end">+</text><rect x="30" y="142" width="270" height="28" rx="8" fill="#f5f6fa" stroke="#d8dbe6"/><text x="44" y="161" font-size="13" fill="#1b2033">Acknowledges their grant</text><text x="284" y="161" font-size="15" font-weight="700" fill="#0b7f7a" text-anchor="end">+</text><rect x="30" y="178" width="270" height="28" rx="8" fill="#f5f6fa" stroke="#d8dbe6"/><text x="44" y="197" font-size="13" fill="#1b2033">Shared coauthors</text><text x="284" y="197" font-size="15" font-weight="700" fill="#0b7f7a" text-anchor="end">+</text><rect x="30" y="214" width="270" height="28" rx="8" fill="#f5f6fa" stroke="#d8dbe6"/><text x="44" y="233" font-size="13" fill="#1b2033">Different first name</text><text x="284" y="233" font-size="15" font-weight="700" fill="#b03a74" text-anchor="end">−</text><rect x="30" y="250" width="270" height="28" rx="8" fill="#f5f6fa" stroke="#d8dbe6"/><text x="44" y="269" font-size="13" fill="#1b2033">Common name</text><text x="284" y="269" font-size="15" font-weight="700" fill="#b03a74" text-anchor="end">−</text>
<line x1="304" y1="165" x2="372" y2="165" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/><text x="338" y="157" font-size="12" fill="#5a6074" text-anchor="middle">weights</text>
<g><rect x="376" y="105" width="190" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="376" y="105" width="5" height="120" rx="2.5" fill="#7a3fc4"/><text x="392" y="132" font-size="15" font-weight="650" fill="#1b2033">Likelihood</text><text x="392" y="155" font-size="13" fill="#5a6074">Weights add up to a</text><text x="392" y="174" font-size="13" fill="#5a6074">score, shown as a %</text></g>
<line x1="568" y1="165" x2="632" y2="165" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/>
<g><rect x="636" y="80" width="170" height="52" rx="10" fill="#f5f6fa" stroke="#d8dbe6"/><circle cx="656" cy="106" r="6" fill="#0b7f7a"/><text x="672" y="102" font-size="14" font-weight="650" fill="#1b2033">Strong</text><text x="672" y="120" font-size="12" fill="#5a6074">95% and above</text><rect x="636" y="148" width="170" height="52" rx="10" fill="#f5f6fa" stroke="#d8dbe6"/><circle cx="656" cy="174" r="6" fill="#a06a00"/><text x="672" y="170" font-size="14" font-weight="650" fill="#1b2033">Possible</text><text x="672" y="188" font-size="12" fill="#5a6074">60% to 95%</text><rect x="636" y="216" width="170" height="52" rx="10" fill="#f5f6fa" stroke="#d8dbe6"/><circle cx="656" cy="242" r="6" fill="#5a6074"/><text x="672" y="238" font-size="14" font-weight="650" fill="#1b2033">Unlikely</text><text x="672" y="256" font-size="12" fill="#5a6074">below 60%</text></g>
<line x1="808" y1="165" x2="862" y2="165" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/>
<g><rect x="866" y="105" width="150" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="866" y="105" width="5" height="120" rx="2.5" fill="#b03a74"/><text x="882" y="132" font-size="15" font-weight="650" fill="#1b2033">A curator</text><text x="882" y="155" font-size="13" fill="#5a6074">accepts or rejects;</text><text x="882" y="174" font-size="13" fill="#5a6074">the decision is kept</text></g>
</svg>
