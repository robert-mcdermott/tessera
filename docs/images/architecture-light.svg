<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-label="How Tessera works: public sources are fetched into a lake, the evidence engine suggests links that curators decide in the ledger, and derived data feeds the API and web app" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>How Tessera works: public sources are fetched into a lake, the evidence engine suggests links that curators decide in the ledger, and derived data feeds the API and web app</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a6074"/></marker></defs>
<rect width="1040" height="560" fill="#ffffff"/>
<g><rect x="30" y="40" width="230" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="30" y="40" width="5" height="120" rx="2.5" fill="#3f5fd1"/><text x="46" y="67" font-size="15" font-weight="650" fill="#1b2033">Public sources</text><text x="46" y="90" font-size="13" fill="#5a6074">PubMed, NIH RePORTER,</text><text x="46" y="109" font-size="13" fill="#5a6074">ClinicalTrials.gov, iCite, ORCID</text></g>
<g><rect x="330" y="40" width="230" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="330" y="40" width="5" height="120" rx="2.5" fill="#3f5fd1"/><text x="346" y="67" font-size="15" font-weight="650" fill="#1b2033">Connectors</text><text x="346" y="90" font-size="13" fill="#5a6074">Rate-limited, incremental,</text><text x="346" y="109" font-size="13" fill="#5a6074">replayable from raw payloads</text></g>
<g><rect x="630" y="40" width="380" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="630" y="40" width="5" height="120" rx="2.5" fill="#0b7f7a"/><text x="646" y="67" font-size="15" font-weight="650" fill="#1b2033">Raw zone and Parquet lake</text><text x="646" y="90" font-size="13" fill="#5a6074">Every response kept as received;</text><text x="646" y="109" font-size="13" fill="#5a6074">normalized records, queried with DuckDB</text></g>
<g><rect x="630" y="220" width="380" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="630" y="220" width="5" height="120" rx="2.5" fill="#7a3fc4"/><text x="646" y="247" font-size="15" font-weight="650" fill="#1b2033">Evidence engine</text><text x="646" y="270" font-size="13" fill="#5a6074">Builds the directory and suggests links,</text><text x="646" y="289" font-size="13" fill="#5a6074">each with its evidence and a likelihood</text></g>
<g><rect x="330" y="220" width="230" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="330" y="220" width="5" height="120" rx="2.5" fill="#b03a74"/><text x="346" y="247" font-size="15" font-weight="650" fill="#1b2033">Ledger</text><text x="346" y="270" font-size="13" fill="#5a6074">People, links, decisions,</text><text x="346" y="289" font-size="13" fill="#5a6074">accounts (SQLite or PostgreSQL)</text></g>
<g><rect x="30" y="220" width="230" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="30" y="220" width="5" height="120" rx="2.5" fill="#b03a74"/><text x="46" y="247" font-size="15" font-weight="650" fill="#1b2033">Curators</text><text x="46" y="270" font-size="13" fill="#5a6074">Confirm or reject</text><text x="46" y="289" font-size="13" fill="#5a6074">suggestions; decisions stick</text></g>
<g><rect x="630" y="400" width="380" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="630" y="400" width="5" height="120" rx="2.5" fill="#a06a00"/><text x="646" y="427" font-size="15" font-weight="650" fill="#1b2033">Derived data</text><text x="646" y="450" font-size="13" fill="#5a6074">Search index, concept profiles,</text><text x="646" y="469" font-size="13" fill="#5a6074">similar people, collaboration graph</text></g>
<g><rect x="330" y="400" width="230" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="330" y="400" width="5" height="120" rx="2.5" fill="#a06a00"/><text x="346" y="427" font-size="15" font-weight="650" fill="#1b2033">API and web app</text><text x="346" y="450" font-size="13" fill="#5a6074">JSON API (/api/v1) and a</text><text x="346" y="469" font-size="13" fill="#5a6074">fast, accessible web app</text></g>
<g><rect x="30" y="400" width="230" height="120" rx="12" fill="#f5f6fa" stroke="#d8dbe6"/><rect x="30" y="400" width="5" height="120" rx="2.5" fill="#4b4bd6"/><text x="46" y="427" font-size="15" font-weight="650" fill="#1b2033">Everyone</text><text x="46" y="450" font-size="13" fill="#5a6074">Search, profiles, experts,</text><text x="46" y="469" font-size="13" fill="#5a6074">connections, reports</text></g>
<line x1="262" y1="100" x2="326" y2="100" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/><text x="294" y="92" font-size="12" fill="#5a6074" text-anchor="middle">fetch</text>
<line x1="562" y1="100" x2="626" y2="100" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/><text x="594" y="92" font-size="12" fill="#5a6074" text-anchor="middle">store</text>
<line x1="820" y1="162" x2="820" y2="216" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/><text x="820" y="193" font-size="12" fill="#5a6074" text-anchor="middle">read</text>
<line x1="626" y1="280" x2="564" y2="280" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/><text x="595" y="272" font-size="12" fill="#5a6074" text-anchor="middle">suggest</text>
<line x1="262" y1="280" x2="326" y2="280" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/><text x="294" y="272" font-size="12" fill="#5a6074" text-anchor="middle">decide</text>
<line x1="820" y1="342" x2="820" y2="396" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/><text x="820" y="373" font-size="12" fill="#5a6074" text-anchor="middle">build</text>
<line x1="626" y1="460" x2="564" y2="460" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/><text x="595" y="452" font-size="12" fill="#5a6074" text-anchor="middle">serve</text>
<line x1="326" y1="460" x2="264" y2="460" stroke="#5a6074" stroke-width="1.6" marker-end="url(#head)"/>
<line x1="445" y1="342" x2="445" y2="396" stroke="#5a6074" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#head)"/>
</svg>
