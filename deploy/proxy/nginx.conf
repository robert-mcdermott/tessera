# nginx in front of Tessera. Put this in /etc/nginx/conf.d/ (or sites-available), replace the
# host names and certificate paths, then: nginx -t && systemctl reload nginx.
# Tessera listens on 127.0.0.1:8000 ([server] host and port).

# Sign-in attempts, per client address. Tessera slows guessing for each account itself, but
# behind a proxy every request comes from the proxy, so only the proxy can count by address.
map $request_method $tessera_signin {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $tessera_signin zone=tessera_signin:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tessera.example.edu research.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tessera.example.edu;

    ssl_certificate     /etc/ssl/tessera/fullchain.pem;
    ssl_certificate_key /etc/ssl/tessera/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 4m;  # branding images are at most 2 MB

    # Tessera reads these to mark its cookies Secure, to check where requests come from, and
    # to build the single sign-on address. It sets its own security headers.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    location / {
        proxy_pass http://127.0.0.1:8000;
        # A first Insight figure at a million papers can take most of a minute.
        proxy_read_timeout 120s;
    }

    location = /api/v1/session {
        limit_req zone=tessera_signin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }
}

# The public site (tessera publish writes it to <data home>/public): plain files.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name research.example.edu;

    ssl_certificate     /etc/ssl/tessera/fullchain.pem;
    ssl_certificate_key /etc/ssl/tessera/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    root /srv/tessera/var/public;
    index index.html;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
