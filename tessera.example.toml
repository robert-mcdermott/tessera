# Tessera configuration
#
# Copy this file to tessera.toml (or run `tessera init`) and edit it.
# Relative paths are resolved against the directory containing this file.
# Scalar settings can be overridden by environment variables named
# TESSERA_<SECTION>_<KEY>, e.g. TESSERA_SERVER_PORT=9000.

# How your organization appears in public records. Tessera uses these to find your
# researchers, publications, grants, and studies. Include every common spelling.
[organization]
name = "Example University"
short_name = "EXU"
# Names as written in publication affiliations, trial records, and so on.
aliases = [
  "Example University",
  "Example Univ",
  "Example University School of Medicine",
]
# Case-insensitive patterns matched against PubMed author affiliations.
# "*" matches any run of characters.
affiliation_patterns = ["example univ*", "exu medical center"]
# Organization names exactly as they appear in NIH RePORTER grant records.
reporter_org_names = ["EXAMPLE UNIVERSITY"]
# Sponsor, collaborator, and site names as they appear in ClinicalTrials.gov.
ctgov_org_names = ["Example University", "Example University Medical Center"]
# Email domains of the organization (used as matching evidence).
email_domains = ["example.edu"]
# Different organizations whose names contain one of the aliases above.
exclusions = ["Example University of Technology"]

# Re-branding. Everything here is optional.
[branding]
product_name = "Tessera"
# The color palette everyone sees by default: "tessera" (calm neutrals, indigo accent),
# "harbor" (deep navy, teal, bright blue, purple, and gold), or "cassette" (label paper
# and rainbow stripes; black labels and a sunset after dark). Each has light and dark
# versions, and each viewer can choose another under Appearance.
theme = "tessera"
# Replace the palette's accent with your own color (hex, a color name, or oklch()).
# accent_color = "#4F46E5"
# Your logo in the sidebar, in place of the Tessera mark and name (SVG, PNG, JPEG, or
# WebP; about 190 x 30 pixels shows best). The dark version is optional.
# logo_light = "branding/logo-light.svg"
# logo_dark = "branding/logo-dark.svg"
show_powered_by = true

[data]
# Where Tessera keeps raw payloads, the Parquet lake, the ledger, derived data, and logs.
home = "var"

[server]
# Without accounts, Tessera answers only on this machine (single-operator mode).
host = "127.0.0.1"
port = 8000
# Name recorded on curation actions while running without accounts.
operator = "Operator"
# Require sign-in with local accounts (needed to listen on any other address). Create the
# first admin with: tessera users add <username> --role admin
accounts = false
# A session ends after this many hours without use, and after this many days in any case.
session_idle_hours = 12
session_max_days = 7

[ledger]
# Leave empty to use SQLite at <data home>/ledger.db.
# PostgreSQL: "postgresql+psycopg://user@host/dbname" (install with the `postgres` extra).
url = ""

[sources]
# Contact address sent to public APIs with each request, as their usage policies ask.
contact_email = "research-it@example.edu"

[sources.pubmed]
enabled = true
# Optional NCBI API key, read from this environment variable (never put keys in this file).
api_key_env = "NCBI_API_KEY"

[sources.icite]
enabled = true

[sources.reporter]
enabled = true

[sources.ctgov]
enabled = true

# Public ORCID records of directory members who have an ORCID iD (no credentials needed).
[sources.orcid]
enabled = true

[sync]
# How many years of history the first sync collects.
window_years = 5

# How confident Tessera must be before suggesting that a person wrote a paper.
[evidence]
strong_threshold = 0.95   # "strong" suggestions, listed first for quick confirmation
review_threshold = 0.60   # below this, suggestions are "unlikely" and hidden by default
discover_min_papers = 2   # affiliated papers needed before proposing a newly discovered person

[discovery]
# Concept profiles: a paper's weight halves every this many years.
half_life_years = 5.0
# Strong suggestions not yet confirmed count this much in profiles (0 counts confirmed only).
likely_weight = 0.5
# Similar people: pairs less similar than this are not kept, and at most this many per person.
similarity_floor = 0.10
similar_per_person = 25
